<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cartera del Tirador</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#10141a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #10141a;
      --card: #161c24;
      --text: #ffffff;
      --text-muted: #8e9aa8;
      --accent: #ff4757;
      --accent-green: #2ed573;
      --accent-blue: #1e90ff;
      --border: rgba(255,255,255,0.08);
      --danger: #ff4757;
    }
    body.light-mode {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2f3640;
      --text-muted: #718093;
      --accent: #ee5253;
      --accent-green: #10ac84;
      --accent-blue: #2e86de;
      --border: rgba(0,0,0,0.06);
    }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 75px;
    }
    header {
      padding: 20px 15px; text-align: center;
      border-bottom: 1px solid var(--border); background: var(--card);
    }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    .contenidor { padding: 15px; }
    
    .pestanya-contingut { display: none; }
    .pestanya-contingut.activa { display: block; }

    /* Alerta de Seguretat Obligatòria */
    .alerta-caducitat {
      background: rgba(255, 71, 87, 0.12); border: 1px solid var(--danger);
      color: #ff6b81; padding: 14px; border-radius: 10px; margin-bottom: 15px;
      font-size: 0.9rem; font-weight: 600; line-height: 1.4; display: none;
    }
    body.light-mode .alerta-caducitat { background: #fff5f5; color: var(--danger); }

    /* Estil net original dels formularis */
    .camp { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
    input[type="text"], input[type="date"], select {
      width: 100%; padding: 12px; border-radius: 8px; box-sizing: border-box;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 1rem; transition: border 0.2s;
    }
    
    /* Botons Natius Amigables */
    .boto-grup { display: flex; gap: 10px; margin-top: 5px; }
    .boto-opcio {
      flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-weight: 600; font-size: 0.9rem;
      cursor: pointer; text-align: center;
    }
    .boto-opcio.actiu {
      background: var(--accent-blue); border-color: var(--accent-blue); color: white;
    }
    button.boto-principal {
      width: 100%; padding: 14px; background: var(--accent-blue); color: white;
      border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;
    }

    /* Targetes de la llista originals */
    .llista-elements { list-style: none; padding: 0; margin: 20px 0; }
    .element-card {
      background: var(--card); border: 1px solid var(--border); padding: 15px;
      border-radius: 12px; margin-bottom: 15px;
    }
    .element-header { display: flex; justify-content: space-between; align-items: center; }
    .element-info strong { font-size: 1.1rem; }
    .element-info span { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
    .imatge-preview { width: 100%; border-radius: 8px; margin-top: 12px; background: #000; max-height: 300px; object-fit: contain; }

    /* Llista de Tirades estil original */
    .item-tirada {
      background: var(--card); border: 1px solid var(--border); padding: 12px 15px;
      border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .item-tirada::before {
      content: ''; width: 4px; height: 24px; border-radius: 2px; margin-right: 12px; display: inline-block;
    }
    .item-tirada.controlada::before { background: var(--accent-blue); }
    .item-tirada.oficial::before { background: var(--accent-green); }
    .item-tirada.categoria::before { background: #9b5de5; }
    .item-tirada.avis-futur::before { background: #f15bb5; }
    .tirada-detalls { flex-grow: 1; }

    .boto-del { background: none; border: none; color: var(--danger); font-weight: bold; font-size: 0.9rem; cursor: pointer; }

    /* Barra de Navegació Inferior Original */
    nav.barra-inferior {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
    }
    .boto-nav {
      background: none; border: none; color: var(--text-muted);
      font-size: 0.9rem; font-weight: 600; text-align: center; width: 50%; height: 100%;
    }
    .boto-nav.actiu { color: var(--text); border-top: 3px solid var(--accent); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>Cartera del tirador</h1>
  </header>

  <div class="contenidor">
    <div id="alerta-obligatoria" class="alerta-caducitat">
      ⚠️ ATENCIÓ: No s'ha detectat cap Tirada Oficial o Controlada en els últims 12 mesos. Risc de pèrdua de llicència o categoria!
    </div>

    <!-- PESTANYA 1: DOCUMENTS -->
    <main id="pestanya-documents" class="pestanya-contingut activa">
      <div id="vista-llista-docs">
        <button class="boto-principal" onclick="mostrarFormulariDoc(true)">+ Afegir document</button>
        <ul id="llista-docs" class="llista-elements"></ul>
      </div>

      <!-- Formulari d'addició amb la interfície neta original -->
      <div id="formulari-doc-pantalla" style="display:none;">
        <h3>Afegir document</h3>
        <form id="formulari-document">
          <div class="camp">
            <label>Categoria</label>
            <select id="categoria-doc">
              <option value="Llicència federativa">Llicència federativa</option>
              <option value="Targeta de soci">Targeta de soci</option>
              <option value="Guia d'arma">Guia d'arma</option>
              <option value="Altres">Altres</option>
            </select>
          </div>
          <div class="camp">
            <label>Títol</label>
            <input type="text" id="titol-doc" placeholder="Nom de la llicència o arma" required>
          </div>
          <div class="camp">
            <label>Imatges</label>
            <!-- Aquest input ocult permet l'accés unificat de l'iPhone a Fototeca / Càmera / Fitxers -->
            <input type="file" id="arxiu-doc" accept="image/*" style="display:none;">
            <div class="boto-grup">
              <button type="button" class="boto-opcio" onclick="activarSelectorFitxer()">Pujar imatges / Fer foto</button>
            </div>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:6px;">L'iPhone us permetrà triar fotos guardades, documents o fer servir la càmera.</p>
            <div id="nom-fitxer-escollit" style="font-size:0.85rem; margin-top:5px; font-weight:600; color:var(--accent-green);"></div>
          </div>
          <div class="boto-grup" style="margin-top:25px;">
            <button type="submit" class="boto-principal" style="background:var(--accent-green);">Desar document</button>
            <button type="button" class="boto-opcio" onclick="mostrarFormulariDoc(false)">Cancel·la</button>
          </div>
        </form>
      </div>
    </main>

    <!-- PESTANYA 2: MÉS (CARREGADA DES DE TIRADOR-APP.HTML) -->
    <main id="pestanya-mes" class="pestanya-contingut">
      <!-- El contingut es carregarà dinàmicament aquí des de tirador-app.html -->
      <div id="contingut-app-mes"></div>
    </main>
  </div>

  <nav class="barra-inferior">
    <button class="boto-nav actiu" onclick="canviarPestanya('documents', this)">Documents</button>
    <button class="boto-nav" onclick="canviarPestanya('mes', this)">Més</button>
  </nav>

  <script>
    let db;
    const request = indexedDB.open('cartera-tirador-db', 2);

    request.onupgradeneeded = event => {
      db = event.target.result;
      if (!db.objectStoreNames.contains('documents')) {
        db.createObjectStore('documents', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('tirades')) {
        db.createObjectStore('tirades', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = event => {
      db = event.target.result;
      carregarDocuments();
      comprovarAlertesTirades();
    };

    function canviarPestanya(pestanya, boto) {
      document.querySelectorAll('.pestanya-contingut').forEach(p => p.classList.remove('activa'));
      document.querySelectorAll('.boto-nav').forEach(b => b.classList.remove('actiu'));
      document.getElementById('pestanya-' + pestanya).classList.add('activa');
      boto.classList.add('actiu');

      if (pestanya === 'mes') {
        carregarPestanyaMes();
      } else {
        carregarDocuments();
      }
    }

    function mostrarFormulariDoc(visible) {
      document.getElementById('vista-llista-docs').style.display = visible ? 'none' : 'block';
      document.getElementById('formulari-doc-pantalla').style.display = visible ? 'block' : 'none';
    }

    function activarSelectorFitxer() {
      document.getElementById('arxiu-doc').click();
    }

    document.getElementById('arxiu-doc').addEventListener('change', e => {
      const fitxer = e.target.files[0];
      if(fitxer) {
        document.getElementById('nom-fitxer-escollit').innerText = "✓ " + fitxer.name;
      }
    });

      // Càrrega asíncrona neta del fitxer tirador-app.html
  function carregarPestanyaMes() {
    fetch('./tirador-app.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('contingut-app-mes').innerHTML = html;
        inicialitzarModulTirades();
      })
      .catch(err => console.error("Error al carregar la secció Més:", err));
  }

  document.getElementById('formulari-document').addEventListener('submit', e => {
    e.preventDefault();
    const categoria = document.getElementById('categoria-doc').value;
    const titol = document.getElementById('titol-doc').value;
    const fitxerInput = document.getElementById('arxiu-doc').files[0];

    if (fitxerInput) {
      const lector = new FileReader();
      lector.onload = function(event) {
        const imatgeBase64 = event.target.result;
        const transaccio = db.transaction(['documents'], 'readwrite');
        
        transaccio.objectStore('documents').add({ categoria, titol, imatge: imatgeBase64 });
        
        transaccio.oncomplete = () => {
          document.getElementById('formulari-document').reset();
          document.getElementById('nom-fitxer-escollit').innerText = "";
          mostrarFormulariDoc(false);
          carregarDocuments();
        };
      };
      lector.readAsDataURL(fitxerInput);
    }
  });

  function carregarDocuments() {
    const ul = document.getElementById('llista-docs');
    ul.innerHTML = '';
    const transaccio = db.transaction(['documents'], 'readonly');
    
    transaccio.objectStore('documents').openCursor().onsuccess = event => {
      const cursor = event.target.result;
      if (cursor) {
        const doc = cursor.value;
        const li = document.createElement('li');
        li.className = 'element-card';
        
        // CORREGIT: Afegides les cometes invertides (``) per evitar l'error de sintaxi a l'HTML
        li.innerHTML = `
          <div class="element-header"> 
            <div class="element-info"> 
              <span>${doc.categoria}</span><br> 
              <strong>${doc.titol}</strong> 
            </div> 
            <button class="boto-del" onclick="eliminarDoc(${doc.id})">Esborrar</button> 
          </div> 
          <img src="${doc.imatge}" class="imatge-preview">
        `;
        
        ul.appendChild(li);
        cursor.continue();
      }
    };
  }

  function eliminarDoc(id) {
    if (confirm("Vols esborrar aquest document?")) {
      const transaccio = db.transaction(['documents'], 'readwrite');
      transaccio.objectStore('documents').delete(id);
      transaccio.oncomplete = () => carregarDocuments();
    }
  }

  function comprovarAlertesTirades() {
    const avui = new Date();
    let ultimaTiradaFeta = null;
    const transaccio = db.transaction(['tirades'], 'readonly');
    
    transaccio.objectStore('tirades').openCursor().onsuccess = event => {
      const cursor = event.target.result;
      if (cursor) {
        const tirada = cursor.value;
        const dataTirada = new Date(tirada.data);
        if (dataTirada < avui && tirada.tipus !== 'avis-futur') {
          if (tirada.tipus === 'controlada' || tirada.tipus === 'oficial') {
            if (!ultimaTiradaFeta || dataTirada > new Date(ultimaTiradaFeta.data)) {
              ultimaTiradaFeta = tirada;
            }
          }
        }
        cursor.continue();
      } else {
        const alertaBox = document.getElementById('alerta-obligatoria');
        if (ultimaTiradaFeta) {
          const dataUltima = new Date(ultimaTiradaFeta.data);
          const diferenciaMesos = (avui - dataUltima) / (1000 * 60 * 60 * 24 * 30.43);
          alertaBox.style.display = (diferenciaMesos >= 12) ? 'block' : 'none';
        } else {
          alertaBox.style.display = 'block';
        }
      }
    };
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
